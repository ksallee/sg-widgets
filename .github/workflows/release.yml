# Publish sg-widgets-core to npm when a GitHub release is published. Nothing else triggers it: a
# tag alone does not, so a mistyped tag costs nothing and the release notes are written before
# anything ships.
#
# No token anywhere. npm Trusted Publishing exchanges this workflow's OIDC identity for a
# short-lived publish token, which is why `id-token: write` is here and no secret is. Trusted
# publishing needs the package to exist, so the first publish is by hand: `npm login` (the name is
# unscoped, no org), then from a clean `main`
#
#   pnpm --filter sg-widgets-core publish --access public
#
# and configure the rest once on npmjs.com, under the package's Trusted Publisher settings:
#
#   owner              ksallee
#   repository         sg-widgets
#   workflow           release.yml
#   environment        npm
#
# The `npm` environment is the second half of that: with it set, only a run in that environment can
# claim the identity, so a workflow added by a pull request cannot publish.
#
# The version published is `version` in packages/core/package.json. npm refuses a version it already
# has, so bump it in the same commit as the release, and never re-point a tag at new code.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gates already build the package on every push. This builds it again from the tagged
      # tree, because that is the tree being published and no other run has seen it.
      - run: pnpm --filter sg-widgets-core build

      - name: The tarball imports before anyone can install it
        working-directory: packages/core
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/check
          cd /tmp/check
          npm init -y >/dev/null
          npm install /tmp/sg-widgets-core-*.tgz
          node -e "import('sg-widgets-core').then((m) => { if (!m.RestClient) throw new Error('no RestClient'); console.log('ok'); })"
          node -e "import('sg-widgets-core/mock').then((m) => { if (!m.MockClient) throw new Error('no MockClient'); console.log('ok'); })"

      # Trusted publishing needs npm 11.5.1 or newer; the runner's npm is older than the Node it
      # ships with.
      - run: npm install -g npm@latest

      # A version already on npm is left alone, so a release made for the record after a manual
      # publish (the first one) passes instead of failing on the version it already has.
      - name: Publish, unless this version is on npm already
        working-directory: packages/core
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "sg-widgets-core@$version" version >/dev/null 2>&1; then
            echo "sg-widgets-core@$version is on npm already; nothing to publish"
            exit 0
          fi
          npm publish --provenance --access public
