<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><style>/* The mark in src/components/WordmarkMark.astro with the default palette's values pinned, from the token block in src/styles/global.css: `--primary`, and the front tile's quiet ink, `--foreground` at 30% over `--background`. The tab strip is not a token, so the gap is cut out rather than painted. */.accent{fill:#006eaf}.quiet{fill:#b9b9b9}@media (prefers-color-scheme:dark){.accent{fill:#38abdf}.quiet{fill:#53585d}}</style><mask id="gap"><rect width="40" height="40" fill="#fff"/><rect x="13.9" y="13.9" width="25.2" height="25.2" rx="3.1" fill="#000"/></mask><rect class="accent" x="2" y="2" width="23" height="23" rx="2" mask="url(#gap)"/><rect class="quiet" x="15" y="15" width="23" height="23" rx="2"/></svg>
